<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHANTOM GRID — Real-Time Cyber Threat Visualization</title>
  <meta name="description" content="Interactive 3D cyber threat visualization engine with real-time attack simulation, MITRE ATT&CK mapping, and geolocation intelligence." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="globe-canvas"></canvas>

    <!-- Scan line overlay -->
    <div class="scanline"></div>

    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <h1 class="logo">PHANTOM<span class="logo-accent">GRID</span></h1>
        <p class="subtitle">REAL-TIME CYBER THREAT INTELLIGENCE</p>
      </div>
      <div class="header-right">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">LIVE</span>
        </div>
        <button id="btn-screenshot" title="Capture Screenshot">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="13" r="3"/><path d="M8 7h.01"/></svg>
        </button>
      </div>
    </header>

    <!-- Stats Dashboard -->
    <aside id="stats-panel">
      <div class="panel-header">
        <span class="panel-icon">⚡</span>
        <span class="panel-title">SYSTEM METRICS</span>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-value" id="stat-aps">0.0</span>
          <span class="stat-label">ATTACKS / SEC</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">TOTAL ATTACKS</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-active">0</span>
          <span class="stat-label">ACTIVE ARCS</span>
        </div>
        <div class="stat-card severity-critical">
          <span class="stat-value" id="stat-critical">0</span>
          <span class="stat-label">CRITICAL</span>
        </div>
        <div class="stat-card severity-high">
          <span class="stat-value" id="stat-high">0</span>
          <span class="stat-label">HIGH</span>
        </div>
        <div class="stat-card severity-medium">
          <span class="stat-value" id="stat-medium">0</span>
          <span class="stat-label">MEDIUM</span>
        </div>
      </div>
      <div class="panel-section">
        <span class="section-title">TOP TARGET PORTS</span>
        <div id="top-ports"></div>
      </div>
      <div class="panel-section">
        <span class="section-title">TOP SOURCE COUNTRIES</span>
        <div id="top-countries"></div>
      </div>
    </aside>

    <!-- Threat Feed -->
    <aside id="threat-feed">
      <div class="panel-header">
        <span class="panel-icon">🔴</span>
        <span class="panel-title">LIVE THREAT FEED</span>
      </div>
      <div id="feed-list"></div>
    </aside>

    <!-- MITRE ATT&CK Filter Panel -->
    <aside id="mitre-panel">
      <div class="panel-header">
        <span class="panel-icon">🛡️</span>
        <span class="panel-title">MITRE ATT&CK</span>
      </div>
      <div id="tactic-filters"></div>
    </aside>

    <!-- Time Controls -->
    <div id="time-controls">
      <button id="btn-slower" title="Slower">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 12L7 19V5l12 7z" transform="rotate(180 12 12)"/></svg>
      </button>
      <button id="btn-pause" title="Pause/Play">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" id="pause-icon"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" id="play-icon" style="display:none"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="btn-faster" title="Faster">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 12l12-7v14L5 12z"/></svg>
      </button>
      <div class="speed-display">
        <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1" />
        <span id="speed-label">1.0×</span>
      </div>
    </div>

    <!-- Attack Detail Card (shown on click) -->
    <div id="attack-detail" class="hidden">
      <button id="detail-close">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
